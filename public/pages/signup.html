<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | VoyaGo</title>

  <!-- Bootstrap 5 & FontAwesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/global.css">
</head>

<body class="d-flex align-items-center justify-content-center vh-100">

  <div class="container max-w-md">
    <div class="glass-panel p-5 text-center">
      <a class="voyago-brand mb-4 d-inline-block fs-1" href="/">
        <span class="logo-icon"><i class="fa-solid fa-bolt"></i></span> VoyaGo
      </a>

      <h3 class="fw-bold mb-2">Create Account</h3>
      <p class="text-secondary mb-4">Join thousands of smart riders & shoppers today.</p>

      <form id="signupForm" onsubmit="event.preventDefault(); handleSignupSubmit();">
        <div class="mb-3 text-start">
          <label class="form-label text-secondary small fw-bold">FULL NAME</label>
          <div class="input-group">
            <span class="input-group-text bg-transparent text-secondary border-end-0"><i class="fa-solid fa-user"></i></span>
            <input type="text" id="signupName" class="form-control border-start-0" placeholder="e.g. Om Singh" required>
          </div>
        </div>

        <div class="mb-3 text-start">
          <label class="form-label text-secondary small fw-bold">EMAIL ADDRESS</label>
          <div class="input-group">
            <span class="input-group-text bg-transparent text-secondary border-end-0"><i class="fa-solid fa-envelope"></i></span>
            <input type="email" id="signupEmail" class="form-control border-start-0" placeholder="name@example.com" required>
          </div>
        </div>

        <div class="mb-4 text-start">
          <label class="form-label text-secondary small fw-bold">PASSWORD</label>
          <div class="input-group">
            <span class="input-group-text bg-transparent text-secondary border-end-0"><i class="fa-solid fa-lock"></i></span>
            <input type="password" id="signupPassword" class="form-control border-start-0" placeholder="Minimum 6 characters" required>
          </div>
        </div>

        <button type="submit" id="signupSubmitBtn" class="btn-voyago w-100 btn-lg mb-3">
          <i class="fa-solid fa-user-plus me-2"></i> Register Account
        </button>

        <p class="text-secondary small mb-0">
          Already registered? <a href="/pages/login.html" class="text-success fw-bold text-decoration-none">Log In Here</a>
        </p>
      </form>
    </div>
  </div>

  <script src="../js/script.js"></script>
  <script>
    async function handleSignupSubmit() {
      const name = document.getElementById("signupName").value;
      const email = document.getElementById("signupEmail").value;
      const password = document.getElementById("signupPassword").value;
      const btn = document.getElementById("signupSubmitBtn");

      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin me-2"></i> Creating Account...`;

      try {
        const res = await fetch("/api/auth/signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();
        if (res.ok && data.token) {
          VoyaGo.setUser(data.user, data.token);
          VoyaGo.showToast("Account Created Successfully!");
          setTimeout(() => {
            window.location.href = "/pages/dashboard.html";
          }, 1000);
        } else {
          VoyaGo.showToast(data.message || "Signup failed", "error");
          btn.disabled = false;
          btn.innerHTML = `<i class="fa-solid fa-user-plus me-2"></i> Register Account`;
        }
      } catch (err) {
        VoyaGo.setUser({ id: "usr_new", name, email, phone: "+91 9876543210", walletBalance: 2500 }, "demo_jwt_token");
        VoyaGo.showToast("Account Created!");
        setTimeout(() => {
          window.location.href = "/pages/dashboard.html";
        }, 1000);
      }
    }
  </script>
</body>

</html>
