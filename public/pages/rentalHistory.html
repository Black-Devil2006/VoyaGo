<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Rental History | VoyaGo</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

body{

background:#F5F7FA;

font-family:Arial,sans-serif;

}

.header{

background:#00B894;

color:white;

padding:25px;

margin-bottom:40px;

}

.history-card{

background:white;

border-radius:20px;

padding:25px;

margin-bottom:25px;

box-shadow:0 8px 20px rgba(0,0,0,.08);

transition:.3s;

}

.history-card:hover{

transform:translateY(-5px);

}

.vehicle{

font-size:24px;

font-weight:bold;

}

.status{

padding:6px 14px;

border-radius:20px;

color:white;

font-size:14px;

}

.completed{

background:#28a745;

}

.active{

background:#0d6efd;

}

.cancelled{

background:#dc3545;

}

.details{

margin-top:20px;

display:grid;

grid-template-columns:repeat(2,1fr);

gap:12px;

}

.details div{

background:#f8f9fa;

padding:12px;

border-radius:10px;

}

.btns{

margin-top:20px;

}

</style>

</head>

<body>

<div class="header">

<div class="container">

<h2>

🚗 Rental History

</h2>

<p>

View all your previous rentals

</p>

</div>

</div>

<div class="container" id="historyList">
    <!-- Will be loaded dynamically from localStorage -->
</div>

<script>
window.addEventListener("load", () => {
    const listContainer = document.getElementById("historyList");
    const rentals = JSON.parse(localStorage.getItem("voyagoRentals")) || [];

    if (rentals.length === 0) {
        listContainer.innerHTML = `
            <div class="alert alert-info text-center mt-5 p-5 shadow-sm rounded-4">
                <h4>No Rental Bookings Found 🚗</h4>
                <p class="text-muted">You haven't rented any vehicles yet.</p>
                <a href="rentals.html" class="btn btn-success mt-3 rounded-pill px-4">Rent a Vehicle</a>
            </div>
        `;
        return;
    }

    listContainer.innerHTML = "";
    rentals.reverse().forEach(rental => {
        listContainer.innerHTML += `
            <div class="history-card">
                <div class="d-flex justify-content-between">
                    <div>
                        <div class="vehicle">${rental.vehicleName}</div>
                        <p class="text-muted mb-0">Booking ID : #${rental.id}</p>
                    </div>
                    <span class="status completed">${rental.status}</span>
                </div>
                <div class="details">
                    <div>
                        📅 Pickup Date<br>
                        <strong>${new Date(rental.pickupDate).toLocaleDateString()}</strong>
                    </div>
                    <div>
                        📅 Return Date<br>
                        <strong>${new Date(rental.returnDate).toLocaleDateString()}</strong>
                    </div>
                    <div>
                        💰 Amount<br>
                        <strong>₹${rental.totalPrice}</strong>
                    </div>
                    <div>
                        📋 Insurance<br>
                        <strong>Included</strong>
                    </div>
                </div>
                <div class="btns">
                    <button class="btn btn-success px-4" onclick="location.href='${rental.type === "car" ? "cars.html" : "bikes.html"}'">
                        Book Again
                    </button>
                    <button class="btn btn-outline-secondary px-4 ms-2" onclick="alert('Invoice downloaded for Booking #${rental.id}')">
                        Invoice
                    </button>
                </div>
            </div>
        `;
    });
});
</script>

</body>

</html>
