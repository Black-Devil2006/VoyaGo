<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rental Successful | VoyaGo</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#F5F7FA;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

}

.success-card{

background:white;

padding:50px;

border-radius:25px;

box-shadow:0 10px 30px rgba(0,0,0,.1);

text-align:center;

max-width:600px;

width:90%;

}

.success-icon{

font-size:90px;

color:#00B894;

margin-bottom:20px;

animation:pop .6s ease;

}

@keyframes pop{

0%{

transform:scale(.3);

opacity:0;

}

100%{

transform:scale(1);

opacity:1;

}

}

h1{

font-size:36px;

margin-bottom:15px;

}

p{

color:#666;

margin-bottom:30px;

font-size:18px;

}

.info{

background:#f8f9fa;

padding:20px;

border-radius:15px;

margin-bottom:30px;

text-align:left;

}

.info div{

display:flex;

justify-content:space-between;

padding:10px 0;

border-bottom:1px solid #ddd;

}

.info div:last-child{

border-bottom:none;

}

.btn{

padding:14px 20px;

margin:8px;

min-width:200px;

}

</style>

</head>

<body>

<div class="success-card">

<div class="success-icon">

<i class="fa-solid fa-circle-check"></i>

</div>

<h1>

Booking Confirmed 🎉

</h1>

<p>

Your rental vehicle has been booked successfully.

</p>

<div class="info">

<div>

<span>Booking ID</span>

<strong>#VR10254</strong>

</div>

<div>

<span>Vehicle</span>

<strong>Mahindra Thar</strong>

</div>

<div>

<span>Pickup Date</span>

<strong>Tomorrow</strong>

</div>

<div>

<span>Status</span>

<strong style="color:green;">

Confirmed

</strong>

</div>

</div>

<a
href="rentalHistory.html"
class="btn btn-success">

View Rental History

</a>

<a
href="dashboard.html"
class="btn btn-outline-primary">

Go To Dashboard

</a>

</div>

</body>

</html>
