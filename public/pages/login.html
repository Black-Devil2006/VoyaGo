<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | VoyaGo</title>

  <!-- Bootstrap 5 & FontAwesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/global.css">
</head>

<body class="d-flex align-items-center justify-content-center vh-100">

  <div class="container max-w-md">
    <div class="glass-panel p-5 text-center">
      <a class="voyago-brand mb-4 d-inline-block fs-1" href="/">
        <span class="logo-icon"><i class="fa-solid fa-bolt"></i></span> VoyaGo
      </a>

      <h3 class="fw-bold mb-2">Welcome Back!</h3>
      <p class="text-secondary mb-4">Log in to manage your rides, rentals, and grocery orders.</p>

      <form id="loginForm" onsubmit="event.preventDefault(); handleLoginSubmit();">
        <div class="mb-3 text-start">
          <label class="form-label text-secondary small fw-bold">EMAIL ADDRESS</label>
          <div class="input-group">
            <span class="input-group-text bg-transparent text-secondary border-end-0"><i class="fa-solid fa-envelope"></i></span>
            <input type="email" id="loginEmail" class="form-control border-start-0" placeholder="name@example.com" value="om@voyago.com" required>
          </div>
        </div>

        <div class="mb-4 text-start">
          <label class="form-label text-secondary small fw-bold">PASSWORD</label>
          <div class="input-group">
            <span class="input-group-text bg-transparent text-secondary border-end-0"><i class="fa-solid fa-lock"></i></span>
            <input type="password" id="loginPassword" class="form-control border-start-0" placeholder="••••••••" value="password123" required>
          </div>
        </div>

        <button type="submit" id="loginSubmitBtn" class="btn-voyago w-100 btn-lg mb-3">
          <i class="fa-solid fa-right-to-bracket me-2"></i> Log In
        </button>

        <p class="text-secondary small mb-0">
          Don't have an account? <a href="/pages/signup.html" class="text-success fw-bold text-decoration-none">Sign Up Here</a>
        </p>
      </form>
    </div>
  </div>

  <script src="../js/script.js"></script>
  <script>
    async function handleLoginSubmit() {
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;
      const btn = document.getElementById("loginSubmitBtn");

      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin me-2"></i> Logging in...`;

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok && data.token) {
          VoyaGo.setUser(data.user, data.token);
          VoyaGo.showToast("Login Successful! Welcome back.");
          setTimeout(() => {
            window.location.href = "/pages/dashboard.html";
          }, 1000);
        } else {
          VoyaGo.showToast(data.message || "Invalid credentials", "error");
          btn.disabled = false;
          btn.innerHTML = `<i class="fa-solid fa-right-to-bracket me-2"></i> Log In`;
        }
      } catch (err) {
        // Demo Fallback login
        VoyaGo.setUser({ id: "usr_om", name: "Om Singh", email, phone: "+91 9876543210", walletBalance: 2450 }, "demo_jwt_token");
        VoyaGo.showToast("Login Successful!");
        setTimeout(() => {
          window.location.href = "/pages/dashboard.html";
        }, 1000);
      }
    }
  </script>
</body>

</html>
