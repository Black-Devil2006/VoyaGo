<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Driver Details | VoyaGo</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

body{
    background:#f4f7fb;
    font-family:Arial,sans-serif;
}

.driver-card{
    max-width:700px;
    margin:50px auto;
    background:white;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
    overflow:hidden;
}

.header{
    background:#00B894;
    color:white;
    text-align:center;
    padding:30px;
}

.driver-photo{
    width:150px;
    height:150px;
    border-radius:50%;
    object-fit:cover;
    border:5px solid white;
    margin-top:-75px;
    background:white;
}

.info{
    padding:30px;
}

.info h3{
    margin-bottom:5px;
}

.info p{
    color:#666;
}

.detail{
    display:flex;
    justify-content:space-between;
    margin:15px 0;
    border-bottom:1px solid #eee;
    padding-bottom:10px;
}

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-top:25px;
}

.actions button,
.actions a{
    padding:12px;
}

.otp{
    background:#e8fff7;
    color:#00B894;
    font-size:28px;
    font-weight:bold;
    text-align:center;
    border-radius:15px;
    padding:15px;
    margin-top:25px;
}

</style>

</head>

<body>

<div class="driver-card">

<div class="header">

<h2>Your Driver is on the way 🚖</h2>

<p>Estimated Arrival: <strong>4 Minutes</strong></p>

</div>

<div class="text-center">

<img src="../images/driver.png" class="driver-photo">

</div>

<div class="info">

<h3>Rahul Sharma</h3>

<p>⭐ 4.9 • 2,483 Trips Completed</p>

<div class="detail">
<span>Vehicle</span>
<strong>Maruti Swift Dzire</strong>
</div>

<div class="detail">
<span>Vehicle Number</span>
<strong>MP04 AB 4567</strong>
</div>

<div class="detail">
<span>Pickup</span>
<strong>Your Current Location</strong>
</div>

<div class="detail">
<span>Drop</span>
<strong>Your Destination</strong>
</div>

<div class="otp">

Ride OTP

<br>

4826

</div>

<div class="actions">

<button class="btn btn-success">
<i class="fa-solid fa-phone"></i>
Call
</button>

<button class="btn btn-primary">
<i class="fa-solid fa-comment"></i>
Message
</button>

<a href="rideTracking.html"
class="btn btn-warning">

Track Ride

</a>

<button
class="btn btn-danger"
onclick="cancelRide()">

Cancel Ride

</button>

</div>

</div>

</div>

<script>

function cancelRide(){

if(confirm("Cancel this ride?")){

alert("Ride Cancelled");

window.location.href="rideBooking.html";

}

}

</script>

</body>

</html>
