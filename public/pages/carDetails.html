<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Car Details | VoyaGo</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

body{

background:#F4F7FB;

font-family:Arial,sans-serif;

}

.container-box{

margin-top:50px;

}

.car-image{

width:100%;

height:420px;

object-fit:cover;

border-radius:20px;

box-shadow:0 10px 25px rgba(0,0,0,.15);

}

.info-card{

background:white;

padding:30px;

border-radius:20px;

box-shadow:0 10px 25px rgba(0,0,0,.08);

height:100%;

}

.feature{

display:flex;

justify-content:space-between;

padding:12px 0;

border-bottom:1px solid #ececec;

}

.price{

font-size:40px;

font-weight:bold;

color:#00B894;

}

.rating{

color:#FFC107;

font-size:20px;

}

.review{

background:white;

padding:20px;

border-radius:15px;

margin-top:25px;

box-shadow:0 5px 15px rgba(0,0,0,.08);

}

.book-btn{

margin-top:30px;

width:100%;

padding:15px;

font-size:18px;

}

</style>

</head>

<body>

<div class="container container-box">

<div class="row">

<div class="col-lg-7">

<img
id="carImage"
src=""
class="car-image">

<div class="review">

<h4>

Customer Reviews

</h4>

<p>

⭐⭐⭐⭐⭐ Amazing vehicle. Very clean and comfortable.

</p>

<p>

⭐⭐⭐⭐⭐ Perfect for long trips.

</p>

<p>

⭐⭐⭐⭐ Comfortable driving experience.

</p>

</div>

</div>

<div class="col-lg-5">

<div class="info-card">

<h2 id="carName">

Loading...

</h2>

<div class="rating" id="carRating">

★★★★★ 0.0

</div>

<div class="price" id="carPrice">

₹0/day

</div>

<hr>

<div class="feature">

<span>

Seats

</span>

<strong id="carSeats">

-

</strong>

</div>

<div class="feature">

<span>

Fuel

</span>

<strong id="carFuel">

-

</strong>

</div>

<div class="feature">

<span>

Transmission

</span>

<strong id="carTransmission">

-

</strong>

</div>

<div class="feature">

<span>

Mileage

</span>

<strong id="carMileage">

-

</strong>

</div>

<div class="feature">

<span>

Pickup

</span>

<strong>

Bhopal

</strong>

</div>

<div class="feature">

<span>

Insurance

</span>

<strong>

Included

</strong>

</div>

<div class="feature">

<span>

Availability

</span>

<strong id="carAvailability" style="color:green;">

Available

</strong>

</div>

<button
class="btn btn-success book-btn"
onclick="bookCar()">

Book Now

</button>

<a
href="cars.html"
class="btn btn-outline-secondary w-100 mt-3">

Back

</a>

</div>

</div>

</div>

</div>

<script src="../js/vehicles.js"></script>
<script src="../js/carDetails.js"></script>

</body>

</html>
