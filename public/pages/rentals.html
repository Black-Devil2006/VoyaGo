<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehicle Rentals | VoyaGo</title>

  <!-- Bootstrap 5 & FontAwesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/global.css">
</head>

<body>

  <!-- NAVBAR -->
  <nav class="voyago-nav">
    <div class="container d-flex align-items-center justify-content-between">
      <a class="voyago-brand" href="/">
        <span class="logo-icon"><i class="fa-solid fa-bolt"></i></span> VoyaGo Rentals
      </a>

      <div class="d-flex align-items-center gap-3">
        <a class="nav-link-custom" href="/"><i class="fa-solid fa-house me-1"></i> Home</a>
        <a class="nav-link-custom" href="/pages/rideBooking.html"><i class="fa-solid fa-taxi me-1"></i> Ride</a>
        <a class="nav-link-custom active" href="/pages/rentals.html"><i class="fa-solid fa-car me-1"></i> Rentals</a>
        <a class="nav-link-custom" href="/pages/grocery.html"><i class="fa-solid fa-basket-shopping me-1"></i> Grocery</a>
        <a class="nav-link-custom" href="/pages/dashboard.html"><i class="fa-solid fa-chart-line me-1"></i> Dashboard</a>

        <button class="btn btn-voyago-outline border-0 py-1 px-2" onclick="VoyaGo.toggleTheme()" title="Toggle Theme">
          <i class="fa-solid fa-moon fs-5"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <div class="text-center max-w-2xl mx-auto mb-5">
      <span class="badge-pill badge-info mb-2 d-inline-block"><i class="fa-solid fa-key me-1"></i> Self-Drive Freedom</span>
      <h1 class="display-4 fw-extrabold mb-2">Rent Bikes & Luxury Cars</h1>
      <p class="text-secondary fs-5">Choose from our sanitized fleet. Daily rates, zero hidden fees, and instant online confirmation.</p>
    </div>

    <!-- Filter Tabs -->
    <div class="d-flex flex-wrap justify-content-center gap-2 mb-5">
      <button class="btn btn-voyago py-2 px-4 filter-btn active" onclick="filterRentalCategory('all', this)">All Fleet</button>
      <button class="btn btn-voyago-outline py-2 px-4 filter-btn" onclick="filterRentalCategory('Bike', this)"><i class="fa-solid fa-motorcycle me-1"></i> Bikes & Scooters</button>
      <button class="btn btn-voyago-outline py-2 px-4 filter-btn" onclick="filterRentalCategory('Car', this)"><i class="fa-solid fa-car me-1"></i> Self-Drive Cars</button>
    </div>

    <!-- Vehicles Grid -->
    <div class="row g-4" id="vehiclesGrid">
      <!-- Injected by JavaScript -->
    </div>
  </div>

  <!-- BOOKING MODAL -->
  <div class="modal fade" id="rentalModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content glass-panel border-0 text-white" style="background: #172033;">
        <div class="modal-header border-secondary border-opacity-25">
          <h5 class="modal-title fw-bold" id="modalVehicleName">Book Vehicle</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="text-center mb-4">
            <img id="modalVehicleImg" src="" alt="Vehicle" class="img-fluid rounded-3 mb-2" style="max-height: 180px; object-fit: cover;">
            <p class="text-success fw-bold fs-4 mb-0">₹<span id="modalDailyRate">0</span> <small class="text-secondary fs-6">/ day</small></p>
          </div>

          <form id="rentalModalForm" onsubmit="event.preventDefault(); submitRentalBooking();">
            <div class="mb-3">
              <label class="form-label text-secondary small fw-bold">RENTAL DURATION (DAYS)</label>
              <input type="number" id="rentalDaysInput" class="form-control" value="1" min="1" max="30" oninput="calculateRentalTotal()" required>
            </div>
            <div class="row g-2 mb-4">
              <div class="col-6">
                <label class="form-label text-secondary small fw-bold">PICKUP DATE</label>
                <input type="date" id="pickupDateInput" class="form-control" required>
              </div>
              <div class="col-6">
                <label class="form-label text-secondary small fw-bold">RETURN DATE</label>
                <input type="date" id="returnDateInput" class="form-control" required readonly>
              </div>
            </div>

            <div class="glass-panel p-3 mb-4 d-flex justify-content-between align-items-center">
              <span class="text-secondary fw-semibold">TOTAL ESTIMATED COST:</span>
              <span class="fs-3 fw-bold text-success">₹<span id="rentalTotalCost">0</span></span>
            </div>

            <button type="submit" class="btn-voyago w-100 btn-lg">
              <i class="fa-solid fa-circle-check me-2"></i> Confirm Booking Now
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/script.js"></script>
  <script src="../js/vehicles.js"></script>
</body>

</html>
