<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart | VoyaGo Mart</title>

  <!-- Bootstrap 5 & FontAwesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/global.css">
</head>

<body>

  <!-- NAVBAR -->
  <nav class="voyago-nav">
    <div class="container d-flex align-items-center justify-content-between">
      <a class="voyago-brand" href="/">
        <span class="logo-icon"><i class="fa-solid fa-bolt"></i></span> VoyaGo Cart
      </a>

      <div class="d-flex align-items-center gap-3">
        <a class="nav-link-custom" href="/pages/grocery.html"><i class="fa-solid fa-arrow-left me-1"></i> Back to Mart</a>
        <button class="btn btn-voyago-outline border-0 py-1 px-2" onclick="VoyaGo.toggleTheme()" title="Toggle Theme">
          <i class="fa-solid fa-moon fs-5"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <h2 class="fw-bold mb-4 d-flex align-items-center gap-2">
      <i class="fa-solid fa-cart-shopping text-success"></i> Review Your Order
    </h2>

    <div class="row g-4">
      <div class="col-lg-8">
        <div class="glass-panel p-4" id="cartListContainer">
          <!-- Injected by JavaScript -->
        </div>
      </div>

      <div class="col-lg-4">
        <div class="glass-panel p-4">
          <h5 class="fw-bold mb-3">Order Summary</h5>

          <div class="d-flex justify-content-between mb-2">
            <span class="text-secondary">Subtotal</span>
            <span class="fw-bold">₹<span id="subtotalAmount">0</span></span>
          </div>
          <div class="d-flex justify-content-between mb-2">
            <span class="text-secondary">Superfast Delivery Fee</span>
            <span class="fw-bold text-success">FREE</span>
          </div>
          <div class="d-flex justify-content-between mb-3">
            <span class="text-secondary">Taxes & Fees</span>
            <span class="fw-bold">₹<span id="taxAmount">15</span></span>
          </div>

          <hr class="border-secondary opacity-25">

          <div class="d-flex justify-content-between mb-4">
            <span class="fs-5 fw-bold">Grand Total</span>
            <span class="fs-3 fw-extrabold text-success">₹<span id="grandTotalAmount">0</span></span>
          </div>

          <div class="mb-3">
            <label class="form-label text-secondary small fw-bold">DELIVERY ADDRESS</label>
            <input type="text" id="cartDeliveryAddress" class="form-control" value="102 Green Park, Bandra West, Mumbai" required>
          </div>

          <div class="mb-4">
            <label class="form-label text-secondary small fw-bold">PAYMENT METHOD</label>
            <select id="cartPaymentMethod" class="form-select">
              <option value="VoyaPay Wallet">VoyaPay Wallet (Balance: ₹2,450)</option>
              <option value="UPI / QR">UPI (GPay / PhonePe / Paytm)</option>
              <option value="Credit / Debit Card">Credit / Debit Card</option>
              <option value="Cash on Delivery">Cash on Delivery</option>
            </select>
          </div>

          <button id="checkoutBtn" class="btn-voyago w-100 btn-lg" onclick="processOrderCheckout()">
            <i class="fa-solid fa-lock me-2"></i> Place Order Now
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/script.js"></script>
  <script src="../js/cart.js"></script>
</body>

</html>
