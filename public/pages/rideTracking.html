<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ride Tracking | VoyaGo</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Leaflet CSS -->
    <link rel="stylesheet"
        href="https://unpkg.com/leaflet/dist/leaflet.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/rideTracking.css">

</head>

<body>

<nav class="navbar navbar-dark bg-dark shadow">
    <div class="container-fluid">

        <span class="navbar-brand mb-0 h1">
            🚖 VoyaGo Live Tracking
        </span>

    </div>
</nav>

<div class="container-fluid">

<div class="row">

<!-- Left Panel -->

<div class="col-lg-4 bg-white shadow p-4 vh-100">

<h2 class="mb-4">

Driver Details

</h2>

<div class="text-center">

<imgsrc="../images/driver.png"
class="rounded-circle"
width="140">

</div>

<hr>

<p>

<strong>👨 Driver:</strong>

Rohit Sharma

</p>

<p>

<strong>⭐ Rating:</strong>

4.9

</p>

<p>

<strong>🛵 Vehicle:</strong>

Honda Activa

</p>

<p>

<strong>🚘 Number:</strong>

MP09AB1234

</p>

<hr>

<h5>

Ride Status

</h5>

<p id="rideStatus">

Driver is arriving...

</p>

<h5>

ETA

</h5>

<p id="eta">

5 mins

</p>

<hr>

<div class="d-grid gap-2">

<button class="btn btn-success">

📞 Call Driver

</button>

<button class="btn btn-primary">

💬 Chat

</button>

<button
class="btn btn-danger"
onclick="window.location.href='payment.html'">

Complete Ride

</button>

</div>

</div>

<!-- Map -->

<div class="col-lg-8 p-0">

<div id="map"></div>

</div>

</div>

</div>

<!-- Leaflet JS -->

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- Ride Tracking JS -->

<script src="../js/rideTracking.js"></script>

</body>

</html>
