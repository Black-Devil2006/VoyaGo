<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile | VoyaGo</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet" href="../css/profile.css">

</head>

<body>

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-10">

<div class="profile-card">

<div class="row">

<div class="col-lg-4 text-center">

<imgsrc="../images/driver.png"
class="profile-img">

<h2 id="userName">
Om Singh
</h2>

<p class="text-muted">
Premium User
</p>

<button
class="btn btn-success w-100 mt-3"
id="editBtn">

Edit Profile

</button>

</div>

<div class="col-lg-8">

<h3 class="mb-4">

Personal Information

</h3>

<div class="row">

<div class="col-md-6 mb-3">

<label>Name</label>

<inputtype="text"
id="name"
class="form-control"
value="Om Singh">

</div>

<div class="col-md-6 mb-3">

<label>Email</label>

<inputtype="email"
id="email"
class="form-control"
value="om@example.com">

</div>

<div class="col-md-6 mb-3">

<label>Phone</label>

<inputtype="text" 
type="text"
id="phone"
class="form-control"
value="+91 9876543210">

</div>

<div class="col-md-6 mb-3">

<label>City</label>

<inputtype="text"
id="city"
class="form-control"
value="Bhopal">

</div>

</div>

<hr>

<h3>

Statistics

</h3>

<div class="stats">

<div class="stat">

<h2>26</h2>

<p>Rides</p>

</div>

<div class="stat">

<h2>9</h2>

<p>Rentals</p>

</div>

<div class="stat">

<h2>31</h2>

<p>Orders</p>

</div>

<div class="stat">

<h2>₹2450</h2>

<p>Wallet</p>

</div>

</div>

<hr>

<button
class="btn btn-primary"
id="saveBtn">

Save Changes

</button>

<a
href="dashboard.html"
class="btn btn-secondary">

Back

</a>

</div>

</div>

</div>

</div>

</div>

</div>

<script src="../js/profile.js"></script>

</body>

</html>
