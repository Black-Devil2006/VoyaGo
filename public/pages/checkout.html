<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout | VoyaGo</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="../css/checkout.css">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

<div class="container">

<a class="navbar-brand fw-bold">

💳 Checkout

</a>

<a href="cart.html" class="btn btn-light">

Back To Cart

</a>

</div>

</nav>

<div class="container mt-5">

<div class="row">

<div class="col-lg-8">

<div class="card p-4 shadow">

<h3>

Delivery Address

</h3>

<input
type="text"
id="name"
class="form-control mt-3"
placeholder="Full Name">

<input
type="text"
id="phone"
class="form-control mt-3"
placeholder="Phone Number">

<textarea
id="address"
class="form-control mt-3"
rows="4"
placeholder="Complete Address"></textarea>

<select
id="payment"
class="form-select mt-3">

<option value="UPI">

UPI

</option>

<option value="Cash On Delivery">

Cash On Delivery

</option>

<option value="Credit Card">

Credit Card

</option>

<option value="Debit Card">

Debit Card

</option>

</select>

</div>

</div>

<div class="col-lg-4">

<div class="card p-4 shadow">

<h3>

Order Summary

</h3>

<hr>

<div id="summary">

Loading...

</div>

<hr>

<h3>

Total

<span
class="float-end"
id="grandTotal">

₹0

</span>

</h3>

<button
class="btn btn-success btn-lg w-100 mt-4"
onclick="placeOrder()">

Place Order

</button>

</div>

</div>

</div>

</div>

<script src="../js/checkout.js"></script>

</body>

</html>
