<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bike Rentals | VoyaGo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/rentals.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand fw-bold fs-3" href="index.html">

                🏍 VoyaGo Bikes

            </a>

            <a href="rentals.html" class="btn btn-outline-light">

                ← Back

            </a>

        </div>

    </nav>

    <!-- Page Heading -->

    <div class="container mt-5">

        <h1 class="section-title text-center">

            Rent Your Favourite Bike

        </h1>

        <p class="text-center text-muted mb-5">

            Choose from premium bikes at affordable daily prices.

        </p>

        <div class="row mb-4">

    <div class="col-md-6">

        <input
            type="text"
            id="searchBike"
            class="form-control"
            placeholder="🔍 Search Bike">

    </div>

    <div class="col-md-6">

        <select
            id="priceFilter"
            class="form-select">

            <option value="all">All Prices</option>

            <option value="200">
                Under ₹200
            </option>

            <option value="300">
                Under ₹300
            </option>

            <option value="500">
                Under ₹500
            </option>

            <option value="1000">
                Under ₹1000
            </option>

        </select>

    </div>

</div>

        <!-- Search -->

        <div class="row justify-content-center mb-4">

            <div class="col-lg-6">

                <input
                    type="text"
                    id="searchBike"
                    class="form-control form-control-lg"
                    placeholder="🔍 Search Bikes...">

            </div>

        </div>

        <!-- Bike Cards -->

        <div class="row g-4" id="bikeContainer">

            <!-- Bikes will load automatically from bikes.js -->

        </div>

    </div>

    <!-- Footer -->

    <footer class="text-center mt-5 mb-4">

        <p class="text-muted">

            © 2026 VoyaGo | Bike Rentals

        </p>

    </footer>

    <!-- JavaScript -->

    <script src="../js/vehicles.js"></script>
    <script src="../js/bikes.js"></script>

</body>

</html>
