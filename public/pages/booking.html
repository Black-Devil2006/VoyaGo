<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Vehicle | VoyaGo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/rentals.css">
</head>

<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="rentals.html" id="navTitle">
                🚗 Vehicle Rental Booking
            </a>
            <a href="rentals.html" class="btn btn-outline-light">Cancel</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <div class="col-lg-6">
                <img id="vehicleImage" src="" class="img-fluid rounded shadow" style="height:350px; width:100%; object-fit:cover;">

                <!-- Pickup Hub Map -->
                <div class="card p-3 shadow-sm mt-4">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h6 class="fw-bold mb-0"><i class="fa-solid fa-location-dot text-success me-1"></i> Pickup Station</h6>
                        <span class="badge bg-success" id="hubDistanceBadge">Detecting distance...</span>
                    </div>
                    <div id="hubMap" style="height: 200px; border-radius: 10px; width: 100%;"></div>
                    <small class="text-muted mt-2 d-block">📍 VoyaGo Central Hub • Bandra West, Mumbai</small>
                </div>
            </div>

            <div class="col-lg-6">
                <h1 id="vehicleName">Loading...</h1>
                <p class="text-muted" id="vehicleRating">⭐ 0.0</p>
                <h2 class="text-success" id="vehiclePrice">₹0 / Day</h2>
                <hr>

                <ul class="list-group mb-4" id="vehicleSpecs">
                    <!-- Loaded dynamically -->
                </ul>

                <div class="card p-4 shadow-sm">
                    <h4>Select Rental Dates</h4>
                    <div class="row mt-3">
                        <div class="col-md-6 mb-3">
                            <label for="pickupDate" class="form-label">Pickup Date</label>
                            <input type="date" id="pickupDate" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="returnDate" class="form-label">Return Date</label>
                            <input type="date" id="returnDate" class="form-control" required>
                        </div>
                    </div>
                    
                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <h5>Estimated Total:</h5>
                        <h3 class="text-success fw-bold" id="totalPrice">Select Dates</h3>
                    </div>

                    <button class="btn btn-success btn-lg w-100 mt-4" id="confirmBtn" onclick="confirmBooking()">
                        Confirm Rental
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../js/mapService.js"></script>
    <script src="../js/vehicles.js"></script>
    <script src="../js/rentalBooking.js"></script>
    <script>
    document.addEventListener("DOMContentLoaded", async () => {
        const hubCoords = [19.0596, 72.8295]; // Bandra Hub
        const hubMapEl = document.getElementById("hubMap");
        if (!hubMapEl || typeof L === "undefined") return;

        const map = L.map("hubMap", { zoomControl: false }).setView(hubCoords, 13);
        L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", {
            attribution: 'Tiles &copy; Esri',
            maxZoom: 19
        }).addTo(map);

        const hubMarker = L.marker(hubCoords, {
            icon: VoyaGoMap.createPinIcon("#00b894", "🏢")
        }).addTo(map).bindPopup("<b>VoyaGo Bandra Hub</b><br>Vehicle ready for pickup!").openPopup();

        try {
            const loc = await VoyaGoMap.getUserLocation();
            const userMarker = L.marker([loc.lat, loc.lng], { icon: VoyaGoMap.createUserIcon() }).addTo(map);
            userMarker.bindPopup("<b>Your Location</b>");
            const dist = VoyaGoMap.getDistance(loc.lat, loc.lng, hubCoords[0], hubCoords[1]);
            const badge = document.getElementById("hubDistanceBadge");
            if (badge) badge.textContent = `${dist.toFixed(1)} km away (~${Math.round(dist * 3)} mins)`;

            const bounds = L.latLngBounds([hubCoords, [loc.lat, loc.lng]]);
            map.fitBounds(bounds, { padding: [40, 40] });
        } catch (e) {
            const badge = document.getElementById("hubDistanceBadge");
            if (badge) badge.textContent = "Open 24/7";
        }
    });
    </script>

</body>
</html>
