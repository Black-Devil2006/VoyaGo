<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ride Started | VoyaGo</title>

    <link rel="stylesheet" href="/css/rideBooking.css">
    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body{
            margin:0;
            font-family:Arial, Helvetica, sans-serif;
            background:#eef3f8;
        }

        .top{
            background:#101820;
            color:white;
            padding:20px;
            text-align:center;
            font-size:28px;
            font-weight:bold;
        }

        .container{
            max-width:1100px;
            margin:30px auto;
            display:grid;
            grid-template-columns:2fr 1fr;
            gap:20px;
            padding:20px;
        }

        .map{
            height:550px;
            border-radius:15px;
            overflow:hidden;
            box-shadow:0 5px 20px rgba(0,0,0,.2);
        }

        iframe{
            width:100%;
            height:100%;
            border:none;
        }

        .card{
            background:white;
            border-radius:15px;
            padding:25px;
            box-shadow:0 5px 20px rgba(0,0,0,.15);
        }

        .card h2{
            margin-bottom:20px;
            color:#101820;
        }

        .info{
            margin:18px 0;
            font-size:18px;
        }

        .status{
            color:#00b894;
            font-weight:bold;
        }

        button{
            width:100%;
            margin-top:25px;
            padding:16px;
            border:none;
            border-radius:10px;
            background:#00b894;
            color:white;
            font-size:18px;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            background:#019875;
        }
    </style>

</head>

<body>

<div class="top">
🚖 Ride Started
</div>

<div class="container">

<div class="map">

<div id="rideStartedMap" style="height: 100%; width: 100%;"></div>

</div>

<div class="card">

<h2>Driver Details</h2>

<div class="info">
👨 <b>Driver:</b> Rohit Sharma
</div>

<div class="info">
⭐ <b>Rating:</b> 4.9
</div>

<div class="info">
🛵 <b>Vehicle:</b> Honda Activa
</div>

<div class="info">
🚘 <b>Vehicle No:</b> MP09AB1234
</div>

<div class="info">
📍 <b>Status:</b>
<span class="status" id="rideStatus">
Driver is arriving...
</span>
</div>

<div class="info">
⏱ <b>ETA:</b>
<span id="eta">8 mins</span>
</div>

<div class="info">
💰 <b>Estimated Fare:</b> ₹235
</div>

<button onclick="window.location.href='rideTracking.html'">
Start Live Tracking
</button>

</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../js/mapService.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const container = document.getElementById("rideStartedMap");
  if (!container || typeof L === "undefined") return;

  const startCoords = [19.0596, 72.8295]; // Bandra West
  const destCoords = [18.9438, 72.8234];  // Marine Drive

  const map = L.map("rideStartedMap", { zoomControl: true }).setView(startCoords, 13);
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", {
    attribution: 'Tiles &copy; Esri',
    maxZoom: 19
  }).addTo(map);

  const route = [
    startCoords,
    [19.0440, 72.8320],
    [19.0300, 72.8260],
    [19.0150, 72.8250],
    [18.9900, 72.8240],
    [18.9750, 72.8235],
    [18.9600, 72.8234],
    destCoords
  ];

  // Route polyline
  const polyline = L.polyline(route, { color: "#00b894", weight: 6, opacity: 0.85, dashArray: "8 6" }).addTo(map);
  map.fitBounds(polyline.getBounds(), { padding: [50, 50] });

  // Pickup & Dest Markers
  L.marker(startCoords, { icon: VoyaGoMap.createPinIcon("#00b894", "📍") }).addTo(map).bindPopup("<b>Pickup:</b> Your Location");
  L.marker(destCoords, { icon: VoyaGoMap.createPinIcon("#fd79a8", "🏁") }).addTo(map).bindPopup("<b>Destination:</b> Marine Drive");

  // Driver Marker
  const driverIcon = VoyaGoMap.createVehicleIcon("auto");
  const driverMarker = L.marker(startCoords, { icon: driverIcon }).addTo(map).bindPopup("<b>Rohit Sharma</b> (Activa)").openPopup();

  let idx = 0;
  setInterval(() => {
    idx = (idx + 1) % route.length;
    driverMarker.setLatLng(route[idx]);
    const remaining = Math.max(1, Math.round((route.length - 1 - idx) * 1.2));
    const etaEl = document.getElementById("eta");
    if (etaEl) etaEl.textContent = `${remaining} mins`;
  }, 2500);
});
</script>

</body>

</html>
