<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ride Started | VoyaGo</title>

    <link rel="stylesheet" href="../css/rideBooking.css">

    <style>
        body{
            margin:0;
            font-family:Arial, Helvetica, sans-serif;
            background:#eef3f8;
        }

        .top{
            background:#101820;
            color:white;
            padding:20px;
            text-align:center;
            font-size:28px;
            font-weight:bold;
        }

        .container{
            max-width:1100px;
            margin:30px auto;
            display:grid;
            grid-template-columns:2fr 1fr;
            gap:20px;
            padding:20px;
        }

        .map{
            height:550px;
            border-radius:15px;
            overflow:hidden;
            box-shadow:0 5px 20px rgba(0,0,0,.2);
        }

        iframe{
            width:100%;
            height:100%;
            border:none;
        }

        .card{
            background:white;
            border-radius:15px;
            padding:25px;
            box-shadow:0 5px 20px rgba(0,0,0,.15);
        }

        .card h2{
            margin-bottom:20px;
            color:#101820;
        }

        .info{
            margin:18px 0;
            font-size:18px;
        }

        .status{
            color:#00b894;
            font-weight:bold;
        }

        button{
            width:100%;
            margin-top:25px;
            padding:16px;
            border:none;
            border-radius:10px;
            background:#00b894;
            color:white;
            font-size:18px;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            background:#019875;
        }
    </style>

</head>

<body>

<div class="top">
🚖 Ride Started
</div>

<div class="container">

<div class="map">

<i frame
src="https://maps.google.com/maps?q=Delhi&t=&z=13&ie=UTF8&iwloc=&output=embed">
</i frame>

</div>

<div class="card">

<h2>Driver Details</h2>

<div class="info">
👨 <b>Driver:</b> Rohit Sharma
</div>

<div class="info">
⭐ <b>Rating:</b> 4.9
</div>

<div class="info">
🛵 <b>Vehicle:</b> Honda Activa
</div>

<div class="info">
🚘 <b>Vehicle No:</b> MP09AB1234
</div>

<div class="info">
📍 <b>Status:</b>
<span class="status" id="rideStatus">
Driver is arriving...
</span>
</div>

<div class="info">
⏱ <b>ETA:</b>
<span id="eta">8 mins</span>
</div>

<div class="info">
💰 <b>Estimated Fare:</b> ₹235
</div>

<button onclick="window.location.href='rideTracking.html'">
Start Live Tracking
</button>

</div>

</div>

<script src="../js/rideTracking.js"></script>

</body>

</html>
